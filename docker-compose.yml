services:
  db:
    image: postgres:16
    container_name: louisiana_pg
    environment:
      POSTGRES_USER: louisiana
      POSTGRES_PASSWORD: louisiana
      POSTGRES_DB: louisiana_routes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: louisiana_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  api:
    build: .
    container_name: louisiana_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://louisiana:louisiana@db:5432/louisiana_routes

volumes:
  pgdata:
