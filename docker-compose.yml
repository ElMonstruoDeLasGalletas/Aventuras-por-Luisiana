services:
  db:
    image: postgres:16
    container_name: louisiana_pg
    environment:
      POSTGRES_USER: louisiana
      POSTGRES_PASSWORD: louisiana
      POSTGRES_DB: louisiana_routes
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: louisiana_adminer
    ports:
      - "8080:8080"

volumes:
  pgdata:

